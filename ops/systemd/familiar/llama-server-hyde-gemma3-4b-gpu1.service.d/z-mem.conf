[Service]
# 2026-06-05: same memory hygiene as the chat variant (see
# docs/familiar-host-tuning-2026-05-28.md, 2026-06-05 follow-up). Latent swap
# pump: base unit had MemoryMax=2G + MemorySwapMax=infinity + an unbounded
# 8192 MiB host prompt cache. Bound the cache, forbid swap, raise the cap to the
# chat variant's proven envelope (same 4.7 GiB gemma model, weights in VRAM so
# the host mmap is reclaimable file cache — no --mlock).
MemoryMax=4G
MemorySwapMax=0
ExecStart=
ExecStart=/opt/llama.cpp/build/bin/llama-server \
  --model /var/cache/llama/models/gemma-4-E4B-it-Q4_K_M.gguf \
  --port 11439 --host 0.0.0.0 \
  --n-gpu-layers 999 --ctx-size 2048 --parallel 2 --threads 8 \
  --cont-batching --alias hyde-gemma3-4b --cache-ram 512
