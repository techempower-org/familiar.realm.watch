[Service]
# Familiar is the steady-state / writethrough-trickle node (katana 2080 Ti handles
# bulk extraction); ctx 4096 / parallel 4 keeps KV + host prompt-cache small.
#
# 2026-06-06 (issue #58 / PR #94 class): close the swap pump. The deployed host
# config had drifted back to MemoryMax=3G + MemorySwapMax=infinity with an
# unbounded 8192 MiB host prompt cache — the same trap fixed for the chat slot
# variants. Now: bound the prompt cache (--cache-ram 1024), forbid swap
# (MemorySwapMax=0 -> clean OOM+restart over silent thrash), and size MemoryMax to
# the real working set. No --mlock: with -ngl 999 the weights live in VRAM, so the
# host mmap is reclaimable file cache. See docs/familiar-host-tuning-2026-05-28.md.
MemoryMax=4G
MemorySwapMax=0
ExecStart=
ExecStart=/opt/llama.cpp/build/bin/llama-server \
  --model /var/cache/llama/models/Phi-4-mini-instruct-Q4_K_M.gguf \
  --port 11436 --host 0.0.0.0 \
  --n-gpu-layers 999 --ctx-size 4096 --parallel 4 --threads 8 \
  --cont-batching --alias phi-4-mini --cache-ram 1024
