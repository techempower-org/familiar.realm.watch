[Service]
# Familiar is the steady-state / writethrough-trickle node now (katana 2080 Ti
# handles bulk extraction). Tightened from parallel 8 / ctx 8192 to halve KV
# cache and host prompt-cache. Update 2026-05-27 evening.
#
# 2026-05-28 update (issue #58): MemoryMax raised from 3G to 4G to match
# observed VmHWM (3.36 GiB). MemorySwapMax=0 added — prefer clean OOM-kill +
# restart over silent swap-thrash. --mlock added to pin the model file's
# mmap pages so cold tokens don't page-fault through swap. The previous
# config was responsible for ~5.6 GiB of swap-resident pages and ~6.5 GiB of
# total host swap pressure. See docs/familiar-host-tuning-2026-05-28.md.
MemoryMax=4G
MemorySwapMax=0
ExecStart=
ExecStart=/opt/llama.cpp/build/bin/llama-server \
  --model /var/cache/llama/models/Phi-4-mini-instruct-Q4_K_M.gguf \
  --port 11436 --host 0.0.0.0 \
  --n-gpu-layers 999 --ctx-size 4096 --parallel 4 --threads 8 \
  --cont-batching --alias phi-4-mini --mlock
