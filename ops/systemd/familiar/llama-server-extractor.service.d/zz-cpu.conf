[Service]
# 2026-07-29: MOVE THE KG EXTRACTOR OFF THE GPU so it can coexist with Ember.
#
# Why. qwen3-coder.service (Ember, the voice-assistant lane) owns BOTH P102s —
# 19.4 of 20.4 GiB VRAM — so it declared Conflicts= on this unit. Conflicts= is
# symmetric, which made the two mutually exclusive and the boot order a coin
# flip: on 2026-07-28 this unit started at 22:44:07 and Ember's start at
# 22:44:48 stopped it. Worse, mempalace-kg-extract@11436.service (enabled, and
# Wants= this unit) stayed up pointing at a dead :11436 and logged
# "LLM request failed: All connection attempts failed" for ~17.7 hours.
#
# Picking a winner (disabling one) would have permanently cost either the voice
# assistant or unattended KG extraction. Moving the extractor to CPU dissolves
# the conflict instead: with no VRAM contention, Ember keeps both GPUs, this
# unit keeps serving :11436, and the Conflicts= entry is dropped from
# qwen3-coder.service. Boot becomes deterministic because no boot-enabled unit
# competes for the GPU any more.
#
# Measured cost on familiar (Ryzen 9 3900X, 12C/24T), Phi-4-mini Q4_K_M:
#   --threads 8   ->  78.7 tok/s prompt eval,  15.22 tok/s generation
#   --threads 16  ->                           13.49 tok/s generation  (WORSE)
# Generation here is memory-bandwidth-bound, so crossing from the 12 physical
# cores into SMT siblings costs throughput rather than adding it. We therefore
# keep --threads 8 and deliberately do NOT copy the --threads 16 used by
# llama-server-chat-gemma3-4b-cpu.service. Ember was unaffected during the
# benchmark: /v1/models stayed at 1.1-2.4 ms and load1 peaked at 7.25 of 24.
#
# GPU throughput was NOT measured for comparison — Ember leaves only ~450-580
# MiB free per card and this model needs ~2.5 GiB, so benchmarking on GPU would
# have required evicting the live assistant. Estimated ~100-130 tok/s from P102
# bandwidth, i.e. CPU is roughly 7-9x slower. That is an acceptable trade for
# background batch extraction, and it is strictly better than the alternative,
# which was extraction not running at all.
#
# CUDA_VISIBLE_DEVICES= (empty) rather than =0: with --n-gpu-layers 0 alone the
# CUDA backend still initialises. Emptying it keeps this process entirely off
# the cards, matching llama-server-chat-gemma3-4b-cpu.service.
Environment=CUDA_VISIBLE_DEVICES=
#
# MEMORY: this is the important departure from z-dual-gpu.conf. That file set
# MemoryMax=4G and explained "with -ngl 999 the weights live in VRAM, so the
# host mmap is reclaimable file cache". With -ngl 0 that reasoning inverts: the
# 2.32 GiB of weights are now resident in HOST RAM and touched every token, so
# they are NOT reclaimable. Working set is ~2.32 GiB weights + KV (4096 ctx
# across 4 slots) + the 1024 MiB bounded prompt cache + compute buffers, which
# lands just over 4 GiB. 4G would OOM-loop; 6G leaves real headroom on a host
# with ~14 GiB available. MemorySwapMax=0 is kept from z-dual-gpu.conf — a
# clean OOM+restart beats silent swap thrash.
MemoryMax=6G
MemorySwapMax=0
ExecStart=
ExecStart=/opt/llama.cpp/build/bin/llama-server \
  --model /var/cache/llama/models/Phi-4-mini-instruct-Q4_K_M.gguf \
  --port 11436 --host 0.0.0.0 \
  --n-gpu-layers 0 --ctx-size 4096 --parallel 4 --threads 8 \
  --cont-batching --alias phi-4-mini --cache-ram 1024
