[Service]
# 2026-06-05 (follow-up to #58 / PR #60): the chat slot-picker variant is the
# unpatched twin of llama-server-extractor — same MemoryMax=3G +
# MemorySwapMax=infinity "swap pump". Refined root cause: llama.cpp keeps a
# host-RAM prompt cache (default limit 8192 MiB; see the "prompt cache is
# enabled, size limit: 8192 MiB" load line). Over days of chat it grew against
# the 3 GiB cgroup cap and the kernel spilled ~5.8 GiB of it into zram, where
# GGUF-dense pages compress only ~1.16x — tying up ~5 GiB of physical RAM to
# enforce a 3 GiB "limit" that saved nothing.
#
# Fix (Flavor A — lean): bound the prompt cache, forbid swap, and raise
# MemoryMax to fit the real working set. Model weights live in VRAM
# (--n-gpu-layers 999), so the 4.7 GiB mmap stays as *reclaimable* file cache
# rather than being --mlock pinned. If memory pressure ever exceeds the cap the
# cgroup OOM-kills cleanly and Restart=on-failure recovers (~5s), instead of
# silently swap-thrashing every decode. See docs/familiar-host-tuning-2026-05-28.md.
MemoryMax=4G
MemorySwapMax=0
ExecStart=
ExecStart=/opt/llama.cpp/build/bin/llama-server \
  --model /var/cache/llama/models/gemma-4-E4B-it-Q4_K_M.gguf \
  --port 11438 --host 0.0.0.0 \
  --n-gpu-layers 999 --ctx-size 8192 --parallel 1 --threads 8 \
  --cont-batching --alias gemma3-4b --cache-ram 1024
