[Service]
# 2026-06-05: memory hygiene (see docs/familiar-host-tuning-2026-05-28.md,
# 2026-06-05 follow-up). Base unit had MemoryMax=2G + MemorySwapMax=infinity +
# unbounded 8192 MiB host prompt cache. Qwen 2.5 Coder 3B (~2 GiB) on GPU, so the
# host mmap is reclaimable; bound the cache, forbid swap, give a small headroom cap.
MemoryMax=3G
MemorySwapMax=0
ExecStart=
ExecStart=/opt/llama.cpp/build/bin/llama-server \
  --model /var/cache/llama/models/qwen2.5-coder-3b.gguf \
  --port 11440 --host 0.0.0.0 \
  --n-gpu-layers 999 --ctx-size 4096 --parallel 2 --threads 8 \
  --cont-batching --alias reflect-qwen-3b --cache-ram 512
