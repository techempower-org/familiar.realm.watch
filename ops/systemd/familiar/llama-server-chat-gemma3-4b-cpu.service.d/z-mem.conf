[Service]
# 2026-06-05: memory hygiene (see docs/familiar-host-tuning-2026-05-28.md,
# 2026-06-05 follow-up). CPU fallback variant: --n-gpu-layers 0 keeps the full
# 4.7 GiB gemma model resident in HOST RAM (actively touched every token, NOT
# reclaimable), so the 8G cap stays. Add MemorySwapMax=0 (clean OOM+restart over
# swap-thrash) and bound the otherwise-8192 MiB host prompt cache.
MemoryMax=8G
MemorySwapMax=0
ExecStart=
ExecStart=/opt/llama.cpp/build/bin/llama-server \
  --model /var/cache/llama/models/gemma-4-E4B-it-Q4_K_M.gguf \
  --port 11448 --host 0.0.0.0 \
  --n-gpu-layers 0 --ctx-size 4096 --parallel 2 --threads 16 \
  --cont-batching --alias gemma3-4b-cpu --cache-ram 1024
