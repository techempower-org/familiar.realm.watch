<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
  <!-- Tells the browser to render UA-controlled chrome (scrollbars, form
       controls, autofill bg) in the matching theme. Without this, dark mode
       still shows white scrollbar tracks on most browsers. Cheap a11y win. -->
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="familiar">
  <meta name="description" content="Your familiar — reads the palace before speaking, writes it after.">
  <!-- Privacy: outbound clicks (e.g., GitHub commit URL from the version
       button) MUST NOT leak the tailnet hostname (familiar.jphe.in) to
       external destinations. no-referrer-when-downgrade still sends the
       full URL on cross-origin HTTPS — wrong for our threat model. The
       strict policy here suppresses Referer entirely on any outbound
       navigation. Defense-in-depth: individual <a> tags also use
       rel="noopener noreferrer" where they open new tabs. -->
  <meta name="referrer" content="no-referrer">
  <title>familiar</title>
  <!-- Dynamic title: stamp the deploy's realm word into the browser tab.
       Each deploy gets a unique poetic name from realm-sigil ("Noble Beacon",
       "Spectral Sigil", etc.) — surfacing it makes the tab feel like a
       page rather than a generic web app. Fails silently on offline /
       /api/version 5xx; the static "familiar" title above remains. -->
  <script>
    (function () {
      try {
        fetch("/api/version", { credentials: "same-origin" })
          .then((r) => (r.ok ? r.json() : null))
          .then((d) => {
            if (!d || typeof d.word !== "string" || !d.word.length) return;
            document.title = `${d.word} · familiar`;
            // Populate the sidebar realm word immediately — without this,
            // the placeholder "·" stays until the slower /api/familiar/health
            // probe completes (~4s under load). /api/version is much faster.
            const w = document.getElementById("word");
            if (w && w.textContent === "·") w.textContent = d.word;
          })
          .catch(() => { /* offline / 5xx — keep static title */ });
      } catch { /* no fetch (very old browser) — keep static */ }
    })();
  </script>
  <!-- FOUC preventer: read localStorage 'drw-theme' BEFORE any stylesheet
       so explicit user theme applies before first paint. Inlined (not <script src>)
       so it's render-blocking even before connection setup. -->
  <script>(function(){try{var s=localStorage.getItem('drw-theme');if(s==='dark'||s==='light')document.documentElement.setAttribute('data-theme',s);}catch(_){}})();</script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="mask-icon" href="/favicon.svg" color="#d4a050">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/dark.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/command-palette.css">
  <link rel="stylesheet" href="/widgets/slot-picker.css">
  <!-- Highlight.js themes load as a pair; one is disabled by JS based on
       the effective theme (explicit user pick > system). Disabling via
       attribute happens after parse, but the FOUC script below runs the
       same resolution synchronously so the inactive sheet's rules never
       win even on first paint. -->
  <link rel="stylesheet" href="/highlight-dark.css" id="hl-dark">
  <link rel="stylesheet" href="/highlight-light.css" id="hl-light">
  <script>
    // Sync the highlight stylesheet pair to the effective theme. Runs
    // once on DOMContentLoaded (so #hl-dark/#hl-light exist) and again
    // on every dark:change emitted by dark.js.
    (function () {
      function syncHL() {
        try {
          var pref = localStorage.getItem('drw-theme');
          var sysDark = window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var eff = (pref === 'dark' || pref === 'light')
            ? pref
            : (sysDark ? 'dark' : 'light');
          var d = document.getElementById('hl-dark');
          var l = document.getElementById('hl-light');
          if (d) d.disabled = (eff !== 'dark');
          if (l) l.disabled = (eff !== 'light');
        } catch (_) { /* swallow */ }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncHL);
      } else {
        syncHL();
      }
      document.addEventListener('dark:change', syncHL);
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncHL);
      }
    })();
  </script>
  <script src="/highlight.min.js" defer></script>
  <script src="/dark.js" defer></script>
  <script src="/dark-toggle.js" defer></script>
</head>
<body data-viz-base-url="">
  <a class="skip-to-main" href="#dashboard">skip to main content</a>
  <noscript>
    <div style="padding:2rem;max-width:42rem;margin:3rem auto;font-family:Georgia,serif;text-align:center;color:#d8d4c8;background:#14181f;border:1px solid #242a33;border-radius:8px;line-height:1.6">
      <h1 style="font-size:1.6rem;color:#d4a050;margin:0 0 0.6rem">familiar.realm.watch</h1>
      <p>This is a JavaScript-powered PWA — please enable JS to use the dashboard.</p>
      <p style="font-size:0.85rem;opacity:0.7;margin-top:1.2rem">Source: <a href="https://github.com/techempower-org/familiar.realm.watch" style="color:#d4a050">github.com/techempower-org/familiar.realm.watch</a></p>
    </div>
  </noscript>
  <aside class="sidebar" id="sidebar" aria-label="sessions, voice, and palace search">
    <header class="sidebar-head">
      <button class="sigil" id="sigil" type="button" aria-label="toggle sessions panel" aria-controls="sidebar" aria-expanded="false" title="sessions">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="0.75" stroke-opacity="0.5"/>
          <path d="M16 4 L16 9 M16 23 L16 28 M4 16 L9 16 M23 16 L28 16" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="2.5" fill="currentColor"/>
          <path d="M9.5 9.5 L22.5 22.5 M22.5 9.5 L9.5 22.5" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.35"/>
        </svg>
      </button>
      <div class="sidebar-title">
        <h1>familiar</h1>
        <button
          type="button"
          class="word"
          id="word"
          title="this build's sigil word — click to see hash, branch, build time"
          aria-label="show build version detail">·</button>
      </div>
      <!-- dark.realm.watch toggle: cycles system → dark → light → system.
           Inherits currentColor/font-size; .theme-toggle below scales it. -->
      <dark-toggle class="theme-toggle" title="cycle theme"></dark-toggle>
    </header>
    <div class="clock-panel" id="clock-panel" title="local time — same anchor the familiar gets each turn">
      <div class="clock-time">
        <span id="clock-hm">··:··</span><span class="clock-seconds" id="clock-sec">··</span>
      </div>
      <div class="clock-date" id="clock-date">·</div>
      <div class="clock-tz" id="clock-tz">·</div>
    </div>
    <div class="sidebar-section voice-section">
      <div class="sessions-head">
        <span class="sessions-title">voice</span>
        <label class="voice-toggle" title="speak each assistant turn aloud">
          <input type="checkbox" id="voice-enabled" aria-label="speak assistant turns aloud">
          <span class="voice-toggle-track"><span class="voice-toggle-knob"></span></span>
        </label>
      </div>
      <select id="voice-picker" class="voice-picker" title="system voice" aria-label="voice for spoken responses"></select>
      <div class="sessions-head" style="margin-top: 0.4rem;">
        <span class="sessions-title">sound fx</span>
        <label class="voice-toggle" title="UI feedback chimes (slot swap, send, error)">
          <input type="checkbox" id="sound-enabled" aria-label="enable UI sound effects">
          <span class="voice-toggle-track"><span class="voice-toggle-knob"></span></span>
        </label>
      </div>
    </div>
    <div class="sidebar-section model-section">
      <div class="sessions-head">
        <span class="sessions-title">model</span>
      </div>
      <select id="model-picker" class="model-picker" title="chat model (persists per-browser)" aria-label="chat model"></select>
    </div>
    <div class="sidebar-section search-section">
      <div class="sessions-head">
        <span class="sessions-title">search</span>
      </div>
      <div class="search-box">
        <input
          type="search"
          id="palace-search"
          class="palace-search-input"
          placeholder="search the palace…"
          aria-label="search the palace"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="search">
      </div>
      <ul class="search-results" id="palace-search-results" hidden></ul>
    </div>
    <div class="sidebar-section">
      <div class="sessions-head">
        <span class="sessions-title">sessions <span class="sessions-count" id="sessions-count" aria-hidden="true"></span></span>
        <button class="sessions-new" id="sessions-new" type="button" title="new session" aria-label="new session">+</button>
      </div>
      <ul class="sessions-list" id="sessions-list"></ul>
    </div>
    <div class="sidebar-section memories-section">
      <div class="sessions-head">
        <span class="sessions-title">memories <span class="sessions-count" id="memories-count" aria-hidden="true"></span></span>
        <button class="sessions-new" id="memories-refresh" type="button" title="refresh" aria-label="refresh">↻</button>
      </div>
      <ul class="memories-list" id="memories-list"></ul>
    </div>
    <div class="sidebar-shortcuts">ctrl+k commands · / focus chat · ctrl+shift+n new · ctrl+shift+s sidebar · /help</div>
  </aside>
  <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="close sessions"></button>
  <main class="main" aria-label="familiar main">
    <header class="hdr">
      <button class="hdr-menu" id="hdr-menu" type="button" aria-label="open sessions" aria-controls="sidebar" aria-expanded="false" title="sessions">
        <svg viewBox="0 0 16 16" aria-hidden="true" width="20" height="20">
          <path d="M2 4 L14 4 M2 8 L14 8 M2 12 L14 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="hdr-title-mobile">familiar</div>
      <nav class="hdr-tabs" role="tablist">
        <button class="hdr-tab active" id="tab-chat" type="button" role="tab" aria-selected="true">chat</button>
        <button class="hdr-tab" id="tab-palace" type="button" role="tab" aria-selected="false">palace</button>
      </nav>
      <button class="hdr-action hdr-action-icon" id="dashboard-add" type="button" title="add or hide blocks" aria-label="add block">
        <svg viewBox="0 0 16 16" aria-hidden="true" width="14" height="14">
          <path d="M8 3 L8 13 M3 8 L13 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="hdr-action" id="dashboard-reset" type="button" title="layout presets / reset">layout</button>
      <div class="status" id="status" role="status" aria-live="polite" aria-atomic="true" title="connection state">quiet</div>
    </header>
    <!-- Dashboard host. Blocks are injected by dashboard.js; the original
         chat/palace markup lives inside hidden source slots below and is
         moved into the block content areas at mount time. This keeps every
         existing id intact so app.js continues to find its nodes. -->
    <div id="dashboard" class="dashboard" role="region" aria-label="familiar dashboard blocks"></div>
    <!-- Source slots: kept hidden in source order; dashboard.js relocates
         their children into block content areas. Don't render here. -->
    <template id="slot-chat">
      <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions" aria-atomic="false"></div>
      <button
        type="button"
        id="scroll-to-bottom"
        class="scroll-to-bottom"
        title="jump to latest"
        aria-label="scroll to latest message"
        hidden>↓</button>
      <div class="typing-indicator" id="typing-indicator" hidden aria-hidden="true">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>
      <form id="form" class="form" autocomplete="off">
        <textarea
          id="input"
          name="msg"
          rows="1"
          aria-label="message to the familiar"
          placeholder="speak to the familiar… (enter to send · shift+enter for newline)"
          autofocus
          spellcheck="true"
          enterkeyhint="send"
          required></textarea>
        <button type="submit" id="send-btn" title="send (enter)" aria-label="send">
          <svg viewBox="0 0 16 16" aria-hidden="true" width="16" height="16">
            <path d="M2 8 L14 8 M9 3 L14 8 L9 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" id="abort-btn" title="stop generation (esc)" aria-label="stop" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true" width="16" height="16">
            <rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor"/>
          </svg>
        </button>
      </form>
    </template>
    <template id="slot-palace">
    <div id="palace-view" class="palace-view">
      <div class="palace-toolbar">
        <span class="palace-stats" id="palace-stats">loading…</span>
        <button class="palace-refresh" id="palace-refresh" type="button" title="refresh">↻</button>
      </div>
      <div class="palace-browser">
        <div class="browser-col browser-col-wings">
          <div class="browser-col-head"><span>wings</span></div>
          <div class="browser-col-body" id="palace-treemap" aria-label="wings"></div>
        </div>
        <div class="browser-col browser-col-rooms" hidden>
          <div class="browser-col-head">
            <span id="palace-rooms-title">rooms</span>
            <button class="browser-back" type="button" id="palace-rooms-back" aria-label="back to wings" title="back">←</button>
          </div>
          <div class="browser-col-body" id="palace-rooms" aria-label="rooms"></div>
        </div>
        <div class="browser-col browser-col-drawers" hidden>
          <div class="browser-col-head">
            <span id="palace-drawers-title">drawers</span>
            <button class="browser-back" type="button" id="palace-drawers-back" aria-label="back to rooms" title="back">←</button>
          </div>
          <div class="browser-col-body" id="palace-drawers" aria-label="drawers"></div>
        </div>
        <!-- 4th column: knowledge-graph entities, sourced from /api/familiar/graph.kg_entities.
             Renders alphabetically with a triple-degree counter; clicking an entity opens
             its triples in the detail panel (kg-mode). Independent of the wing/room/drawer
             drill-down — toggled by the "kg" header tab below. -->
        <div class="browser-col browser-col-kg">
          <div class="browser-col-head">
            <span>kg</span>
            <span class="browser-col-count" id="palace-kg-count" title="entities · triples"></span>
          </div>
          <div class="browser-col-body" id="palace-kg" aria-label="knowledge graph entities"></div>
        </div>
      </div>
      <div class="palace-detail" id="palace-detail" hidden>
        <div class="palace-detail-head">
          <span class="palace-detail-chain" id="palace-detail-chain"></span>
          <button class="browser-back" type="button" id="palace-detail-close" aria-label="close" title="close">×</button>
        </div>
        <pre class="palace-detail-body" id="palace-detail-body"></pre>
      </div>
      <div class="palace-tunnels" id="palace-tunnels"></div>
    </div>
    </template>
    <template id="slot-model">
      <div class="model-block-body">
        <p class="model-block-hint">the richer five-slot picker shipped — add the <strong>slots</strong> block via the dashboard's <code>+</code> button. This sidebar entry remains as a quick chat-only override.</p>
      </div>
    </template>
  </main>
  <script type="module" src="/widgets/toast.js"></script>
  <script type="module" src="/widgets/slot-picker.js"></script>
  <!-- Stat widget scripts — load order specified at top of stats-init.js (#64). -->
  <link rel="stylesheet" href="/widgets/stats.css">
  <script src="/widgets/stats-util.js"></script>
  <script src="/widgets/stats-poller.js"></script>
  <script src="/widgets/stats-gpu.js"></script>
  <script src="/widgets/stats-cpu.js"></script>
  <script src="/widgets/stats-mem.js"></script>
  <script src="/widgets/stats-disk.js"></script>
  <script src="/widgets/stats-net.js"></script>
  <script type="module" src="/widgets/stats-init.js"></script>
  <script type="module" src="/dashboard-init.js"></script>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/command-palette.js"></script>
</body>
</html>
